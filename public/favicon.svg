<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    .surf { fill: #171717; }
    .line { stroke: #fff; fill: none; stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; }
    .node { fill: #171717; stroke: #fff; stroke-width: 3.25; }
    .dot { fill: #fff; }
    @media (prefers-color-scheme: light) {
      .surf { fill: #f4f4f5; }
