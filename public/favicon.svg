  </style>
  <rect class="surface" width="64" height="64" rx="14"/>
  <path class="wire" d="M10 16 22 48 32 24 42 48 54 16" fill="none" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="node" cx="54" cy="16" r="5.25" stroke-width="3.25"/>
