    @media (prefers-color-scheme: dark) {
      .surface { fill: #f4f4f5; }
      .wire, .node-dot { stroke: #0a0a0a; fill: #0a0a0a; }
      .node { fill: #f4f4f5; stroke: #0a0a0a; }
